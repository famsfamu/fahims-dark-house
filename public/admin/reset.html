<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password Reset</title><link rel="stylesheet" href="/styles.css"></head><body><div class="admin-wrap"><div class="admin-card" style="max-width:460px;margin:10vh auto"><img src="/assets/logo.svg" style="width:220px"><h2>Forgot Password</h2><form id="request"><input name="email" type="email" placeholder="Admin email" required><button class="btn gold">Send Reset Link</button></form><p id="msg"></p><hr><h2>Reset Password</h2><form id="reset"><input name="token" placeholder="Reset token" required><input name="newPassword" type="password" placeholder="New password (10+ characters)" required><button class="btn gold">Reset Password</button></form></div></div><script>async function api(u,o={}){const r=await fetch(u,{headers:{'Content-Type':'application/json'},...o});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}document.querySelector('#request').onsubmit=async e=>{e.preventDefault();try{let d=await api('/api/admin/forgot-password',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});document.querySelector('#msg').textContent=d.message}catch(x){document.querySelector('#msg').textContent=x.message}};const token=new URLSearchParams(location.search).get('token');if(token)document.querySelector('[name=token]').value=token;document.querySelector('#reset').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/reset-password',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});document.querySelector('#msg').textContent='Password reset successful. You can now login.'}catch(x){document.querySelector('#msg').textContent=x.message}}</script></body></html>
